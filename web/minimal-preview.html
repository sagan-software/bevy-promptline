<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minimal · Bevy Promptline</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111b20;color:#e5eff0}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}h1{margin:0;font-size:18px;font-weight:600}a{color:#b4dada;text-underline-offset:4px}.viewport{height:calc(100dvh - 56px);position:relative}canvas{display:block;width:100%;height:100%;outline-offset:-3px}canvas:focus-visible{outline:2px solid #8bd7d0}#status{position:absolute;inset:0;display:grid;place-content:center;background:#111b20}#status[hidden]{display:none}button{background:#17474d;color:#fff;border:1px solid #70adaf;padding:10px 18px;font:inherit;cursor:pointer}
</style>
<header><h1>Minimal</h1><a href="https://github.com/Sagan-Software/bevy-promptline/blob/main/examples/minimal.rs">Source</a></header>
<div class="viewport"><canvas id="bevy" tabindex="0" aria-label="Minimal Bevy Promptline example"></canvas><div id="status" role="status">Loading example…</div></div>
<script type="module">
const canvas=document.querySelector('#bevy');
const status=document.querySelector('#status');
canvas.addEventListener('pointerdown',()=>canvas.focus());
canvas.addEventListener('keydown',event=>{if(event.key==='Tab'&&document.activeElement===canvas)event.preventDefault();});
canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();fail('Graphics context lost. Reload the example.');});
function fail(message){status.hidden=false;status.replaceChildren();const text=document.createElement('p');text.textContent=message;const retry=document.createElement('button');retry.textContent='Reload example';retry.onclick=()=>location.reload();status.append(text,retry);}
try{const{default:init}=await import('./app.js');await init();status.hidden=true;}catch(error){console.error(error);fail('The example could not start. Check graphics support and reload.');}
</script>
</html>
